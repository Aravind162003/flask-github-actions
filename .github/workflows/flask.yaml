name: Flask CI

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Python
        run: python3 --version

      - name: Create virtual environment
        run: python3 -m venv .venv

      - name: Install dependencies
        run: .venv/bin/pip install -r requirements.txt

      - name: Test Flask application
        run: .venv/bin/python -c "from app import app; print('Flask application works!')"

      - name: Start Flask application
        run: |
          # Clear tracking ID so the runner doesn't kill the background job
          export RUNNER_TRACKING_ID="" 
          
          # Use flask run with host 0.0.0.0 to allow external access
          nohup .venv/bin/flask --app app.py run --host=0.0.0.0 --port=5000 > flask.log 2>&1 &
